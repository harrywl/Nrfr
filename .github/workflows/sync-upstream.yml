name: Sync Upstream

on:
  schedule:
    # 每月 1 日 UTC 02:00 自动同步
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      upstreams:
        description: "上游仓库（空格分隔）"
        required: true
        default: "baiyanwu/Nrfr Ackites/Nrfr"
      branch:
        description: "合并目标分支"
        required: true
        default: "master"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync All Upstreams
        run: |
          BASE_BRANCH="${{ inputs.branch || 'master' }}"
          UPSTREAMS="${{ inputs.upstreams || 'baiyanwu/Nrfr Ackites/Nrfr' }}"
          SUMMARY=""
          NOW=$(date +%s)

          for UPSTREAM in $UPSTREAMS; do
            echo ""
            echo "═══════════════════════════════════════════════"
            echo "  正在处理上游: $UPSTREAM"
            echo "═══════════════════════════════════════════════"

            REMOTE_NAME="upstream-$(echo "$UPSTREAM" | tr '/' '-')"

            # 添加上游 remote & fetch
            git remote add "$REMOTE_NAME" "https://github.com/${UPSTREAM}.git" 2>/dev/null || true
            if ! git fetch "$REMOTE_NAME" --quiet 2>&1; then
              echo "  ⚠️ 无法获取 $UPSTREAM，跳过"
              SUMMARY="${SUMMARY}- ⚠️ **${UPSTREAM}**: 无法连接，跳过\n"
              continue
            fi

            # 获取上游默认分支
            UPSTREAM_BRANCH=$(git remote show "$REMOTE_NAME" | grep "HEAD branch" | awk '{print $NF}')
            echo "  上游默认分支: $UPSTREAM_BRANCH"

            # 获取上游最近提交时间
            LAST_COMMIT_TIME=$(git log "${REMOTE_NAME}/${UPSTREAM_BRANCH}" -1 --format="%ct" 2>/dev/null || echo "0")
            LAST_COMMIT_DATE=$(git log "${REMOTE_NAME}/${UPSTREAM_BRANCH}" -1 --format="%ci" 2>/dev/null || echo "unknown")

            # 计算非活跃天数
            INACTIVE_DAYS=$(( (NOW - LAST_COMMIT_TIME) / 86400 ))
            echo "  最近提交时间: $LAST_COMMIT_DATE ($INACTIVE_DAYS 天前)"

            # 检查差异
            BEHIND=$(git rev-list --count "origin/${BASE_BRANCH}..${REMOTE_NAME}/${UPSTREAM_BRANCH}" 2>/dev/null || echo 0)

            # 如果上游超过 180 天无新提交且无差异 → 视为停滞上游，跳过
            if [ "$INACTIVE_DAYS" -gt 180 ] && [ "$BEHIND" -eq 0 ]; then
              echo "  ⏭️ 上游 $INACTIVE_DAYS 天无新提交，已停滞，跳过"
              SUMMARY="${SUMMARY}- ⏭️ **${UPSTREAM}**: 停滞 ${INACTIVE_DAYS} 天无新提交\n"
              continue
            fi

            if [ "$BEHIND" -eq 0 ]; then
              echo "  ✅ $UPSTREAM 无新变更"
              SUMMARY="${SUMMARY}- ✅ **${UPSTREAM}**: 无新变更\n"
              continue
            fi

            echo "  🔄 $UPSTREAM 有 $BEHIND 个新提交待合并"
            SUMMARY="${SUMMARY}- 🔄 **${UPSTREAM}**: ${BEHIND} commits (${INACTIVE_DAYS}d) "

            # 尝试合并
            if git merge "${REMOTE_NAME}/${UPSTREAM_BRANCH}" --no-edit -m "chore: 同步上游 ${UPSTREAM} (${BEHIND} commits)"; then
              echo "  ✅ 合并成功"
              SUMMARY="${SUMMARY}→ ✅ 已合并\n"
            else
              echo "  ⚠️ 合并冲突，创建 PR 供人工处理"

              CONFLICT_BRANCH="sync/$(echo "$UPSTREAM" | tr '/' '-')-$(date +%Y%m%d%H%M%S)"
              git checkout -b "$CONFLICT_BRANCH"
              git add -A
              git commit -m "chore: 合并上游变更（包含冲突标记，需人工解决）" || true
              git push origin "$CONFLICT_BRANCH"

              CONFLICT_FILES=$(git diff --name-only --diff-filter=U | sed 's/^/- `/;s/$/`/' | head -20)

              # 构建 PR body 避免多行 YAML 问题
              PR_BODY="上游 [${UPSTREAM}](https://github.com/${UPSTREAM}) 有 ${BEHIND} 个新提交，自动合并时产生冲突。\n\n"
              PR_BODY="${PR_BODY}## 操作步骤\n"
              PR_BODY="${PR_BODY}1. 在此 PR 中解决冲突\n"
              PR_BODY="${PR_BODY}2. 确认合并后提交\n"
              PR_BODY="${PR_BODY}3. 合并此 PR 完成同步\n\n"
              PR_BODY="${PR_BODY}## 冲突文件\n${CONFLICT_FILES}"

              if gh pr create \
                --base "$BASE_BRANCH" \
                --head "$CONFLICT_BRANCH" \
                --title "🔄 $UPSTREAM 同步 $(date +%Y-%m-%d) — 需解决冲突" \
                --body "$(printf "$PR_BODY")"; then
                SUMMARY="${SUMMARY}→ ⚠️ [冲突 PR](https://github.com/harrywl/Nrfr/pulls) 已创建\n"
              else
                echo "  ⚠️ 创建 PR 失败"
                SUMMARY="${SUMMARY}→ ❌ PR 创建失败\n"
              fi

              git checkout "$BASE_BRANCH"
              continue
            fi
          done

          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo -e "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Push Merged Changes
        run: |
          BASE_BRANCH="${{ inputs.branch || 'master' }}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/${BASE_BRANCH})" ]; then
            git push origin "${BASE_BRANCH}"
            echo "✅ 变更已推送到 ${BASE_BRANCH}"
          else
            echo "ℹ️ 无变更需要推送"
          fi

      - name: Summary
        if: always()
        run: |
          echo "### 📊 同步汇总"
          echo "${{ steps.sync.outputs.summary }}"
