name: Build Release
run-name: Build Android Release ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.4"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, package, and publish Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and changelog
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${MANUAL_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${VERSION}" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release version: ${VERSION}"
            echo "The version must start with v and contain only letters, digits, dots, underscores, or hyphens."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            RANGE="${PREVIOUS_TAG}..${GITHUB_SHA}"
          else
            RANGE="${GITHUB_SHA}"
          fi

          ALL_COMMITS="$(git log "${RANGE}" --pretty=format:'%h %s (%an)' | grep -v -E '^[a-f0-9]+ (ci|docs):' || true)"
          FEAT_COMMITS="$(printf '%s\n' "${ALL_COMMITS}" | grep -E '^[a-f0-9]+ feat:' || true)"
          FIX_COMMITS="$(printf '%s\n' "${ALL_COMMITS}" | grep -E '^[a-f0-9]+ fix:' || true)"
          OTHER_COMMITS="$(printf '%s\n' "${ALL_COMMITS}" | grep -v -E '^[a-f0-9]+ (feat|fix):' || true)"

          {
            if [[ -n "${FEAT_COMMITS}" ]]; then
              printf '### 功能改进\n%s\n\n' "${FEAT_COMMITS}"
            fi
            if [[ -n "${FIX_COMMITS}" ]]; then
              printf '### 问题修复\n%s\n\n' "${FIX_COMMITS}"
            fi
            if [[ -n "${OTHER_COMMITS}" ]]; then
              printf '### 其他更新\n%s\n' "${OTHER_COMMITS}"
            fi
            if [[ -z "${ALL_COMMITS}" ]]; then
              printf '### 无更新内容\n'
            fi
          } > CHANGELOG.md

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Test and build Android APKs
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:assembleDebug
          :instrumentation-target:assembleDebug

      - name: Collect release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/nrfr-${RELEASE_VERSION}.apk"
          cp instrumentation-target/build/outputs/apk/debug/instrumentation-target-debug.apk "artifacts/nrfr-instrumentation-target-${RELEASE_VERSION}.apk"
          cd artifacts
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nrfr-android-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            artifacts/nrfr-${{ steps.version.outputs.version }}.apk
            artifacts/nrfr-instrumentation-target-${{ steps.version.outputs.version }}.apk
            artifacts/SHA256SUMS.txt
