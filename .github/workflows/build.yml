name: Build Release
run-name: Build Android Release ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.4"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, package, and publish Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and release notes
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${MANUAL_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${VERSION}" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release version: ${VERSION}"
            echo "The version must start with v and contain only letters, digits, dots, underscores, or hyphens."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          VERSION_HEADER="## ${VERSION}"
          awk -v header="${VERSION_HEADER}" '
            index($0, header) == 1 { capture = 1 }
            capture && /^## / && index($0, header) != 1 { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "No changelog entry found for ${VERSION}."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build Android APKs
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:assembleDebug
          :instrumentation-target:assembleDebug

      - name: Collect release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/nrfr-${RELEASE_VERSION}.apk"
          cp instrumentation-target/build/outputs/apk/debug/instrumentation-target-debug.apk "artifacts/nrfr-instrumentation-target-${RELEASE_VERSION}.apk"
          cd artifacts
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nrfr-android-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            artifacts/nrfr-${{ steps.version.outputs.version }}.apk
            artifacts/nrfr-instrumentation-target-${{ steps.version.outputs.version }}.apk
            artifacts/SHA256SUMS.txt
